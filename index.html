<!DOCTYPE html>
<html lang="en" class="!bg-page [color-scheme:light]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylized Match Game</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="!bg-page font-sans m-0 p-4 flex flex-col items-center justify-start text-ink">
  <div id="app" class="w-full max-w-content mx-auto">

    <section id="step-a" class="[&[hidden]]:!hidden">
      <div id="mount-a" class="group relative [&.is-loading]:min-h-[calc(100vh-32px)] [&.is-loading]:flex [&.is-loading]:items-center [&.is-loading]:justify-center"></div>
    </section>

    <section id="step-game" class="[&[hidden]]:!hidden pt-7" hidden>
      <p id="intro" class="[&[hidden]]:!hidden mt-0 mb-2.5 text-[24px] font-bold leading-[1.65]">Okay, let's try something interactive! Tell us what suits you best.</p>

      <div id="progress" class="[&[hidden]]:!hidden mb-3" hidden>
        <p id="progress-label" class="mt-0 mb-2 text-[14px] font-semibold text-muted"></p>
        <div class="w-full h-1.5 rounded-full bg-line overflow-hidden">
          <div id="progress-bar" class="h-full rounded-full bg-primary [transition:width_0.3s_ease]"></div>
        </div>
      </div>

      <p id="question" class="[&[hidden]]:!hidden mt-0 mb-2 text-[24px] font-bold leading-[1.3]" hidden></p>
      <p id="hint" class="mt-0 mb-5 text-[16px] leading-[1.5]"></p>

      <div id="game-area" class="w-full"></div>

      <div id="status-msg" role="status" aria-live="polite" class="mt-6 font-semibold text-[1rem] min-h-[24px] text-muted [&.success-text]:!text-success"></div>

      <div class="mt-7 flex justify-start gap-3">
        <button id="next-game" class="[font-family:inherit] text-[1rem] font-semibold text-white bg-primary border-0 rounded-lg py-3 px-7 cursor-pointer [transition:background_0.2s_ease,transform_0.2s_ease,opacity_0.2s_ease] enabled:hover:bg-primary-hover enabled:hover:-translate-y-px disabled:opacity-[0.35] disabled:cursor-not-allowed" type="button" disabled>Next</button>
        <button id="skip-game" class="[font-family:inherit] text-[1rem] font-semibold text-ink bg-transparent border border-solid border-line rounded-lg py-3 px-7 cursor-pointer [transition:background_0.2s_ease,transform_0.2s_ease] hover:bg-black/5 hover:-translate-y-px" type="button">Skip</button>
      </div>

      <p class="mt-8 mb-0 text-[14px] leading-[1.5] text-muted">This survey is for insight only and is not a diagnosis. If you're finding things hard, please talk to someone you trust or your university's counselling service.</p>
    </section>

    <section id="step-b" class="[&[hidden]]:!hidden" hidden>
      <div id="mount-b" class="group relative [&.is-loading]:min-h-[calc(100vh-32px)] [&.is-loading]:flex [&.is-loading]:items-center [&.is-loading]:justify-center"></div>
    </section>

  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
